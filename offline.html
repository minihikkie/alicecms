<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ออฟไลน์ — ไม่มีการเชื่อมต่ออินเทอร์เน็ต</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: 'Prompt', 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #1A73E8, #1557B0); color: #fff; text-align: center; }
  .box { max-width: 420px; }
  .ic { width: 96px; height: 96px; margin: 0 auto 18px; background: rgba(255,255,255,.15); border-radius: 28px;
    display: grid; place-items: center; }
  .ic svg { width: 52px; height: 52px; fill: #fff; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { opacity: .9; line-height: 1.7; margin: 0 0 22px; }
  button { font: inherit; font-weight: 600; border: 0; cursor: pointer; padding: 12px 26px; border-radius: 999px;
    background: #fff; color: #1557B0; box-shadow: 0 8px 22px rgba(0,0,0,.2); }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="box">
    <div class="ic">
      <svg viewBox="0 0 24 24"><path d="M12 3 2 9.5V11h2v8H2v2h20v-2h-2v-8h2V9.5L12 3zm-6 8h2v8H6v-8zm5 0h2v8h-2v-8zm5 0h2v8h-2v-8z"/></svg>
    </div>
    <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>ขณะนี้อุปกรณ์ของท่านออฟไลน์อยู่ หน้าที่เคยเปิดแล้วยังดูได้ตามปกติ<br>กรุณาตรวจสอบการเชื่อมต่อแล้วลองใหม่อีกครั้ง</p>
    <button onclick="location.reload()">ลองใหม่อีกครั้ง</button>
  </div>
</body>
</html>
